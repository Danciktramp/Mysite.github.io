<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
</head>
<body>
    <div class="w3-display-container w3-orange" >
        <h1 class="">To-Do-List</h1>
        <button class="w3-display-right w3-hover-green" style="margin-right: 3%; font-size: 140%;" id="addbt">Add</button>
        <button id="clearbt" class="w3-display-left w3-hover-green" style="margin-left: 3% ;font-size: 140%;">Clear All</button>
        <button id="helpbt" class="w3-display-left w3-hover-green" style="margin-left: 20%; font-size: 140%;">Neclarities</button>
    </div>
    <div class="w3-display-container">
        <ol id="notebox">
        </ol>

        <script>
        document.addEventListener('DOMContentLoaded', () => {
            const addBtn = document.getElementById("addbt");
            const clearBtn = document.getElementById("clearbt");
            const noteBox = document.getElementById("notebox");

            function addNote() {
                const newInput = document.createElement('input');
                newInput.type = 'text';
                newInput.placeholder = 'New task...';
                // Make the input occupy the full width of its container
                newInput.style.width = '100%';
                newInput.style.boxSizing = 'border-box';
                newInput.style.padding = '8px';
                newInput.style.fontSize = '1rem';

                const li = document.createElement('li');
                // Ensure list item doesn't add unexpected padding/margins
                li.style.padding = '0.25rem 0';
                // Hint for users
                li.title = 'Double-click this item to delete it (will cross out first)';

                // Add a small transition for the deletion animation
                li.style.transition = 'color 0.15s ease, opacity 0.3s ease, transform 0.2s ease';

                // Delete the note on double-click with visual feedback:
                // cross out the text and change color to red, then remove the element.
                li.addEventListener('dblclick', () => {
                    // Apply visual delete state
                    li.style.color = 'red';
                    li.style.textDecoration = 'line-through';
                    li.style.opacity = '0.6';
                    li.style.transform = 'translateX(6px)';

                    // Remove after a short delay so the user sees the change
                    setTimeout(() => {
                        if (li.parentNode) li.parentNode.removeChild(li);
                    }, 420);
                });

                li.appendChild(newInput);
                noteBox.appendChild(li);
                newInput.focus();
            }

            function clearAll() {
                noteBox.innerHTML = '';
            }

            if (addBtn) addBtn.addEventListener('click', addNote);
            if (clearBtn) clearBtn.addEventListener('click', clearAll);

            // Help button: show a short usage tip
            const helpBtn = document.getElementById('helpbt');
            function showHelp() {
                window.alert('Tip: to save a note, tap outside the input field. ' + 
                'To deleat just a note doubletap');
            }
            if (helpBtn) helpBtn.addEventListener('click', showHelp);
        });
        
        </script>
</body>
</html>
